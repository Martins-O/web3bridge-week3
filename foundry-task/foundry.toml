[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# CoreDAO Testnet
[rpc_endpoints]
coredao_testnet = "https://rpc.test.btcs.network"
coredao_mainnet = "https://rpc.coredao.org"

[etherscan]
coredao_testnet = { key = "${CORESCAN_API_KEY}", url = "https://api.test.btcs.network/api" }
coredao_mainnet = { key = "${CORESCAN_API_KEY}", url = "https://openapi.coredao.org/api" }